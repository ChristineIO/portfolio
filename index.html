<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./index.css" />
    <title>My GitHub Portfolio</title>
</head>

<body>
    <div class="container">
        <div class="card">
            <div class="header">
                <h1>ChristineIO.exe</h1>
                <div class="window-controls">
                    <div class="button">.</div>
                    <div class="button">.</div>
                    <div class="button">.</div>
                </div>
            </div>
            <div class="content">
                <div class="profile">
                    <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"
                        aria-hidden="true">
                        <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" />
                        <circle cx="12" cy="7" r="4" />
                    </svg>
                </div>
                <div class="text">
                    <h2 style="font-size: 24px;">Hello world</h2>
                    <p>learning to code, one project at a time</p>
                </div>
            </div>
        </div>
    </div>
    <div class="repos-container">
        <div class="card repo">
            <div class="header">
                <h1 id="repo">repo</h1>
                <div class="window-controls">
                    <div class="button">.</div>
                    <div class="button">.</div>
                    <div class="button">.</div>
                </div>
            </div>
            <div class="content">
                <div class="text">
                    <h2 id="desc">Repo description from Github</h2>
                    <div class="section">
                        <div class="main-lang" id="main-lang">Javascript</div>
                        <div class="star"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16"
                                viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-star preview-icon">
                                <path
                                    d="M11.525 2.295a.53.53 0 0 1 .95 0l2.31 4.679a2.123 2.123 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904l-3.736 3.638a2.123 2.123 0 0 0-.611 1.878l.882 5.14a.53.53 0 0 1-.771.56l-4.618-2.428a2.122 2.122 0 0 0-1.973 0L6.396 21.01a.53.53 0 0 1-.77-.56l.881-5.139a2.122 2.122 0 0 0-.611-1.879L2.16 9.795a.53.53 0 0 1 .294-.906l5.165-.755a2.122 2.122 0 0 0 1.597-1.16z" />
                            </svg>
                            <span id="star">12</span>
                        </div>
                        <div class="time"> <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18"
                                viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-clock preview-icon">
                                <circle cx="12" cy="12" r="10" />
                                <path d="M12 6v6l4 2" />
                            </svg>
                        </div>
                    </div>
                    <button onclick="openRepo()" id="button" class="card-button">
                        <h2>open repo &rarr;</h2>
                    </button>
                </div>
            </div>
        </div>
    </div>
</body>
<script src="./index.js"></script>
</html>
